<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Chat</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/styles/github-dark.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="scrim" id="scrim"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <span class="brand-dot"></span>
          <span>RAG Chat</span>
        </div>
        <button class="pill-btn new-chat" id="newChatBtn" aria-label="New chat">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 2.5v11M2.5 8h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          New chat
        </button>
      </div>
      <div class="threads" id="threadList" aria-label="Chat history"></div>
      <div class="sidebar-footer">
        <span class="model-dot"></span>
        <span id="modelLabel">gpt-oss-120b &middot; Groq</span>
        <button class="gear-btn" id="settingsBtn" aria-label="Chat settings" title="API key & model">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M8 10.2a2.2 2.2 0 1 0 0-4.4 2.2 2.2 0 0 0 0 4.4Z" stroke="currentColor" stroke-width="1.4"/><path d="M13.3 8c0-.4 0-.8-.1-1.1l1.3-1-.9-1.6-1.5.5c-.3-.3-.7-.5-1-.7L10.8 2H8.9l-.4 1.6c-.4.2-.7.4-1 .7l-1.5-.5-.9 1.6 1.3 1c-.1.3-.1.7-.1 1.1s0 .8.1 1.1l-1.3 1 .9 1.6 1.5-.5c.3.3.7.5 1 .7l.4 1.6h1.9l.4-1.6c.3-.2.7-.4 1-.7l1.5.5.9-1.6-1.3-1c.1-.3.1-.7.1-1.1Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open chat history">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <div class="title-pill" id="threadTitle">New chat</div>
        <div class="topbar-spacer"></div>
      </header>

      <div class="messages-container" id="messagesContainer" role="log">
        <div class="messages" id="messages"></div>
      </div>

      <div class="composer-area">
        <div class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Ask about the indexed documents&hellip;" aria-label="Message"></textarea>
          <button class="send-btn" id="sendBtn" aria-label="Send message" disabled>
            <svg class="icon-send" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8.2 13.2V3.2m0 10-4.6-4.6m4.6 4.6 4.6-4.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg class="icon-stop" width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="4" y="4" width="8" height="8" rx="2" fill="currentColor"/></svg>
          </button>
        </div>
        <div class="composer-hint">Enter to send &middot; Shift+Enter for a new line</div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="settingsModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <h2 id="settingsTitle">Chat settings</h2>
      <p class="modal-sub">Plug in your own model API. Keys stay in this browser and are sent only to the local server.</p>
      <label class="field">
        <span>Provider</span>
        <select id="cfgProvider">
          <option value="groq">Groq</option>
          <option value="anthropic">Anthropic</option>
          <option value="google_genai">Google Gemini</option>
          <option value="openai">OpenAI-compatible (custom URL)</option>
        </select>
      </label>
      <label class="field">
        <span>Model</span>
        <input id="cfgModel" type="text" placeholder="openai/gpt-oss-120b" autocomplete="off" spellcheck="false" />
      </label>
      <label class="field">
        <span>API key</span>
        <input id="cfgKey" type="password" placeholder="Paste your API key" autocomplete="off" />
      </label>
      <label class="field" id="cfgBaseUrlField" hidden>
        <span>Base URL</span>
        <input id="cfgBaseUrl" type="text" placeholder="https://api.groq.com/openai/v1" autocomplete="off" spellcheck="false" />
      </label>
      <div class="modal-status" id="cfgStatus"></div>
      <div class="modal-actions">
        <button class="pill-btn" id="cfgSave">Save</button>
        <button class="pill-btn subtle" id="cfgReset">Use server default</button>
        <button class="pill-btn subtle" id="cfgClose">Close</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.3.0/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/highlight.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
